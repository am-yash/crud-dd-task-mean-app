services:
  backend:
    image: yashdockerio/mean-backend:latest
    container_name: mean-backend
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://mongo:27017/dd_db

  frontend:
    image: yashdockerio/mean-frontend:latest
    container_name: mean-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
